# ---------- Course Service ----------
spring.application.name=course-service
server.port=8082

# ---------- H2 in-memory database ----------
spring.datasource.url=jdbc:h2:mem:coursedb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 web console: http://localhost:8082/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- Inter-service communication ----------
# Local run  : http://localhost:8081
# Docker     : -e STUDENT_SERVICE_URL=http://student-service:8081
# Kubernetes : injected from ConfigMap (course-service-config)
student.service.url=${STUDENT_SERVICE_URL:http://localhost:8081}

# ---------- Actuator (used by Kubernetes probes) ----------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

logging.level.com.bits.sreg=INFO
